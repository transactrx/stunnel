name: West Image Upload

on:
  push:
    branches: [ "Development", "Production" ]

jobs:
  ##################
  # Set Deploy Environment #
  ##################
  SetDeployEnv:
    name: 'Set Deployment Env'
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ env.TARGET_ENVIRONMENT }}

    steps:
      - name: Determine Environment
        run: |
          echo "TARGET_ENVIRONMENT=${GITHUB_REF##*/}" >> $GITHUB_ENV

  ##################
  # Build & Push to ECR (us-west-2)
  ##################
  build-and-push-west:
    runs-on: ubuntu-latest
    needs: SetDeployEnv
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.SetDeployEnv.outputs.deploy_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate unique DEPLOYMENT_VERSION
        id: version
        run: |
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          timestamp=$(date -u +"%Y%m%dT%H%MZ")
          DEPLOYMENT_VERSION="${short_sha}-${timestamp}"
          echo "DEPLOYMENT_VERSION=$DEPLOYMENT_VERSION" >> $GITHUB_ENV
          echo "Generated Deployment Version: $DEPLOYMENT_VERSION"

      - name: Setup Environment
        run: |
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          branchUpper=$(echo ${branch^^})
          role_name_prefix="TRANSACTRX_"
          role_name_suffix="_AWS_ROLE_ARN_WEST"
          AWS_ROLE=$role_name_prefix$branchUpper$role_name_suffix
          echo "AWS_ROLE=$(echo $AWS_ROLE)" >> $GITHUB_ENV
          REPO_NAME=$(echo ${GITHUB_REPOSITORY##*/})
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "Resolved AWS_ROLE: $AWS_ROLE"
          echo "Resolved REPO_NAME: $REPO_NAME"

      - name: Configure AWS credentials (us-west-2)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets[env.AWS_ROLE] }}
          role-session-name: ${{ env.REPO_NAME }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr-west
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image (us-west-2)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-west.outputs.registry }}
          ECR_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOYMENT_VERSION: ${{ env.DEPLOYMENT_VERSION }}
        run: |
          DOCKER_REPO=$(echo "${ECR_REPOSITORY,,}")
          echo "Building image for $DOCKER_REPO in us-west-2..."
          docker build --build-arg DEPLOYMENT_VERSION=$DEPLOYMENT_VERSION -t $ECR_REGISTRY/$DOCKER_REPO:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$DOCKER_REPO:$IMAGE_TAG $ECR_REGISTRY/$DOCKER_REPO:latest
          docker push $ECR_REGISTRY/$DOCKER_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$DOCKER_REPO:latest
          echo "Updating version parameter in us-west-2"
          aws ssm put-parameter \
            --name "/$DOCKER_REPO/version/west" \
            --value "$DEPLOYMENT_VERSION" \
            --type String \
            --overwrite