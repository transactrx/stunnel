# This workflow will build a golang project and deploy it using Terraform (east region)
# The structure and flow are identical to your working EastDeployment.yml.

name: EastDeployment
on:
  push:
    branches: [ "Development","Production" ]
jobs:

  ##################
  # Set Deploy Environment #
  ##################
  SetDeployEnv:
    name: 'Set Deployment Env'
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ env.TARGET_ENVIRONMENT }}

    steps:
      - name: Determine Environment
        run: |
          echo "TARGET_ENVIRONMENT=${GITHUB_REF##*/}" >> $GITHUB_ENV

  build-and-push:
    runs-on: ubuntu-latest
    needs: SetDeployEnv
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.SetDeployEnv.outputs.deploy_env }}

    steps:
      - name: Generate unique DEPLOYMENT_VERSION
        id: deployment_version
        run: |
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          timestamp=$(date -u +"%Y%m%dT%H%MZ")
          DEPLOYMENT_VERSION="${short_sha}-${timestamp}"
          echo "DEPLOYMENT_VERSION=$DEPLOYMENT_VERSION" >> $GITHUB_ENV
          echo "Generated Deployment Version: $DEPLOYMENT_VERSION"

      - name: Setup Environment
        run: |
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          branchUpper=$(echo ${branch^^})
          role_name_prefix="TRANSACTRX_"
          role_name_suffix="_AWS_ROLE_ARN_EAST"
          AWS_ROLE=$role_name_prefix$branchUpper$role_name_suffix
          echo "AWS_ROLE=$(echo $AWS_ROLE)"  >> $GITHUB_ENV
          REPO_NAME=$(echo ${GITHUB_REPOSITORY##*/})
          echo "REPO_NAME=$(echo $REPO_NAME)"  >> $GITHUB_ENV
          echo '${{ toJSON(vars) }}'
          echo "Resolved AWS_ROLE: $AWS_ROLE"
          echo "Resolved REPO_NAME: $REPO_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[env.AWS_ROLE] }}
          role-session-name: ${{ github.REPO_NAME }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure Terraform Backend
        run: |
          bucket=$(aws ssm get-parameter --name terraform_state_bucket_name | jq -r .Parameter.Value)
          lock_table=$(aws ssm get-parameter --name terraform_lock_table | jq -r .Parameter.Value)
          cd terraform
          terraform init -backend-config="bucket=$bucket" \
                         -backend-config="key=$REPO_NAME" \
                         -backend-config="region=us-east-1" \
                         -backend-config="dynamodb_table=$lock_table" \
                         -input=false -upgrade

      - name: Deploy terraform Resources
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOYMENT_VERSION: ${{ env.DEPLOYMENT_VERSION }}
        run: |
          DOCKER_REPO=$( echo "${ECR_REPOSITORY,,}" )
          export TF_VAR_project_name=$REPO_NAME
          export TF_VAR_image_full="$ECR_REGISTRY/$DOCKER_REPO:$IMAGE_TAG"
          export TF_VAR_environment=$branchUpper
          export TF_VAR_version_param="/$REPO_NAME/version/east"
          export TF_VAR_deployment_version=$DEPLOYMENT_VERSION
          cd terraform
          terraform apply -input=false -auto-approve

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOYMENT_VERSION: ${{ env.DEPLOYMENT_VERSION }}
        run: |
          DOCKER_REPO=$( echo "${ECR_REPOSITORY,,}")
          echo "Building Docker image for $DOCKER_REPO..."
          docker build --build-arg DEPLOYMENT_VERSION=$DEPLOYMENT_VERSION -t $ECR_REGISTRY/$DOCKER_REPO:latest .
          docker build --build-arg DEPLOYMENT_VERSION=$DEPLOYMENT_VERSION -t $ECR_REGISTRY/$DOCKER_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$DOCKER_REPO:latest
          docker push $ECR_REGISTRY/$DOCKER_REPO:$IMAGE_TAG